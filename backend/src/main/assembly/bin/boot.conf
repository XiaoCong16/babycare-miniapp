#!/usr/bin/env bash
. "${APP_HOME}/bin/boot.config"

PID_FILE="${APP_HOME}/bin/${APP_NAME}.pid"
LOG_DIR="${APP_HOME}/../xcAppLogs/${APP_NAME}-logs"

is_running() {
    [ -f "$PID_FILE" ] || return 1
    local pid
    pid=$(cat "$PID_FILE")
    [[ "$pid" =~ ^[0-9]+$ ]] || return 1
    kill -0 "$pid" 2>/dev/null
}
