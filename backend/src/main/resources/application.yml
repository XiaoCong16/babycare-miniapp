server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/babycare?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

wechat:
  appid: ${WX_APPID:your-appid}
  secret: ${WX_SECRET:your-secret}
  template-id: ${WX_TEMPLATE_ID:your-template-id}
