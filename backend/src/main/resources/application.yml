server:
  port: 8080

spring:
  datasource:
    url: ${WXAPP_DB_URL}
    username: ${WXAPP_DB_USERNAME}
    password: ${WXAPP_DB_PASSWORD}
    driver-class-name: ${WXAPP_DB_CLASS_NAME}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wechat:
  appid: ${WX_APPID:your-appid}
  secret: ${WX_SECRET:your-secret}
  template-id: ${WX_TEMPLATE_ID:your-template-id}
