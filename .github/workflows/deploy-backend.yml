name: Deploy backend

on:
  workflow_dispatch:

concurrency:
  group: babycare-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qiniuyun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configure Nacos server address
        env:
          NACOS_SERVER_ADDR: ${{ vars.NACOS_SERVER_ADDR || '127.0.0.1:8848' }}
        run: |
          set -euo pipefail
          if [[ ! "$NACOS_SERVER_ADDR" =~ ^(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9._-]+):[0-9]+(,(\[[0-9A-Fa-f:]+\]|[A-Za-z0-9._-]+):[0-9]+)*$ ]]; then
            echo "NACOS_SERVER_ADDR must be a host:port or a comma-separated server list" >&2
            exit 1
          fi
          sed -i -E "s|^([[:space:]]*)server-addr:.*$|\1server-addr: ${NACOS_SERVER_ADDR}|" \
            backend/src/main/resources/bootstrap.yml
          replacement_count=$(grep -Fxc "        server-addr: ${NACOS_SERVER_ADDR}" \
            backend/src/main/resources/bootstrap.yml || true)
          if [ "$replacement_count" -ne 2 ]; then
            echo "Expected to configure two Nacos server-addr entries, found $replacement_count" >&2
            exit 1
          fi

      - name: Build distribution
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml clean package

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/data/babycare-server' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp "${SSH_OPTS[@]}" -P "$DEPLOY_PORT" \
            backend/target/babycare-server.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:babycare-server.tar.gz"
          {
            printf 'DEPLOY_DIR=%q\n' "$DEPLOY_DIR"
            cat .github/scripts/deploy-backend.sh
          } | ssh "${SSH_OPTS[@]}" -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s'
